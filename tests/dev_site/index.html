<!doctype html>
<html><head><meta charset="utf-8"><title>dev server test</title></head>
<body><h1>served by a development server</h1>
<script>
  (async () => {
    const r = {};
    r.origin = location.origin;
    r.bridge = await cling.invoke('ping');                       // the bridge reaches a page served by the dev server
    const blocked = [];
    cling.window.onNavigationBlocked(function (e) { blocked.push(e.url); });
    setTimeout(function () { location.href = 'https://example.invalid/top'; }, 0);   // leaving the dev server's origin is refused
    for (let i = 0; i < 40 && blocked.length < 1; i++) await new Promise(function (resolve) { setTimeout(resolve, 50); });
    r.blocked = blocked.length;
    r.still = location.origin === r.origin;
    await cling.invoke('selftest', r);
  })().catch(function (e) { cling.invoke('selftest', { error: String(e) }); });
</script></body></html>
