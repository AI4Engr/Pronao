<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>My app</title></head>
<body>
<h1>My app</h1>
<pre id="out">(results appear here)</pre>
<script>
  const out = document.getElementById('out');
  (async () => {
    const lines = [];
    lines.push('add 2 + 3 = ' + await pronao.invoke('add', [2, 3]));
    lines.push('mean = ' + await pronao.invoke('mean', [4, 8, 12]));
    lines.push(await pronao.invoke('greet', { name: 'Ada' }));
    try { await pronao.invoke('fail'); } catch (e) { lines.push('fail -> ' + JSON.stringify(e)); }
    out.textContent = lines.join('\n');
  })();
</script>
</body>
</html>
