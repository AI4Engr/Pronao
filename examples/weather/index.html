<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weather</title>
<meta name="color-scheme" content="dark">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #fff; font-weight: 500;
    background:
      radial-gradient(560px 380px at 10% 6%, #3b82f6 0%, transparent 70%),
      radial-gradient(480px 360px at 95% 14%, #8b5cf6 0%, transparent 72%),
      radial-gradient(560px 400px at 68% 108%, #06b6d4 0%, transparent 70%),
      #0b1230;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .glass {
    width: 100%; max-width: 640px; padding: 20px 24px 22px;
    background: rgba(255, 255, 255, .13);
    backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, .3); border-radius: 22px;
    box-shadow: 0 20px 55px rgba(5, 10, 40, .5), inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  header img { width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0, 0, 0, .35); }
  header .name { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  header .name small { display: block; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,.82); letter-spacing: 0; }
  .chips { margin-left: auto; display: flex; gap: 6px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
    padding: 5px 13px; border-radius: 999px;
    background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3);
  }
  .chip:hover { background: rgba(255, 255, 255, .26); }
  .chip.on { background: rgba(255, 255, 255, .92); color: #14306e; border-color: transparent; }
  .now { display: flex; align-items: center; gap: 18px; margin: 6px 4px 18px; }
  .now .icon { font-size: 64px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
  .now .temp { font-size: 66px; font-weight: 650; line-height: 1; letter-spacing: -2px; }
  .now .temp sup { font-size: 26px; font-weight: 600; letter-spacing: 0; vertical-align: top; position: relative; top: 8px; }
  .now .meta { margin-left: auto; text-align: right; font-size: 14px; font-weight: 600; line-height: 1.7; }
  .now .meta span { color: rgba(255,255,255,.85); font-weight: 500; }
  .city { font-size: 15px; font-weight: 650; margin-bottom: 2px; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .day {
    text-align: center; padding: 11px 4px 10px; border-radius: 15px;
    background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22);
  }
  .day .d { font-size: 13px; font-weight: 650; }
  .day .i { font-size: 28px; margin: 5px 0 3px; }
  .day .hi { font-size: 16px; font-weight: 700; }
  .day .lo { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.8); }
  footer { margin-top: 14px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.82); display: flex; justify-content: space-between; }
  .sub2 { padding: 18px 4px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.9); }
  .err { padding: 12px 14px; border-radius: 12px; background: rgba(254,202,202,.2); border: 1px solid rgba(254,202,202,.5); font-weight: 600; }
</style>
</head>

    <div class="name">Weather<small>a Pronao example</small></div>
    <div class="chips" id="chips"></div>
  </header>
  <div id="view"></div>
  <footer><span id="src"></span><span>Weather data by Open-Meteo.com (CC BY 4.0)</span></footer>
</div>
<script>
  const ICON = { sunny: '☀️', partly: '⛅', cloudy: '☁️', rain: '🌧️', snow: '❄️', storm: '⛈️' };
  const LABEL = { sunny: 'Sunny', partly: 'Partly cloudy', cloudy: 'Cloudy', rain: 'Rain', snow: 'Snow', storm: 'Storm' };
  // WMO weather interpretation codes, as Open-Meteo reports them
  function sky(code) {
    if (code === 0) return 'sunny';
    if (code <= 2) return 'partly';
    if (code === 3 || code === 45 || code === 48) return 'cloudy';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
    if (code >= 95) return 'storm';
    return 'rain';
  }
  const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const view = document.getElementById('view'), chips = document.getElementById('chips');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let latest = 0;
  async function show(city) {
    const mine = ++latest;
    for (const c of chips.children) c.classList.toggle('on', c.textContent === city.name);
    view.innerHTML = '<div class="city">' + esc(city.name) + '</div><div class="sub2">Loading…</div>';
    try {
      // the request is sent by the program, which allows only this host; the page gets the status, the headers and the text
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city.latitude + '&longitude=' + city.longitude +
        '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5';
      const r = await pronao.http.request({ url, headers: { Accept: 'application/json' } });
      if (mine !== latest) return;
      if (r.status !== 200) throw { code: 'http_' + r.status, message: 'the service answered ' + r.status };
      const f = JSON.parse(r.body);
      const now = f.current, d = f.daily;
      let days = '';
      for (let i = 0; i < d.time.length; i++) {
        const when = new Date(d.time[i] + 'T12:00:00');
        days += '<div class="day"><div class="d">' + WEEKDAY[when.getDay()] + '</div><div class="i">' + ICON[sky(d.weather_code[i])] + '</div>' +
          '<div class="hi">' + Math.round(d.temperature_2m_max[i]) + '°</div><div class="lo">' + Math.round(d.temperature_2m_min[i]) + '°</div></div>';
      }
      view.innerHTML =
        '<div class="city">' + esc(city.name) + '</div>' +
        '<div class="now"><div class="icon">' + ICON[sky(now.weather_code)] + '</div>' +
        '<div class="temp">' + Math.round(now.temperature_2m) + '<sup>°C</sup></div>' +
        '<div class="meta">' + LABEL[sky(now.weather_code)] + '<br><span>Humidity ' + now.relative_humidity_2m + '%</span><br><span>Wind ' + Math.round(now.wind_speed_10m) + ' km/h</span></div></div>' +
        '<div class="days">' + days + '</div>';
      document.getElementById('src').textContent = 'Source: open-meteo.com';
    } catch (e) {
      if (mine !== latest) return;
      view.innerHTML = '<div class="city">' + esc(city.name) + '</div><div class="err">' + esc(e.code || 'error') + ': ' + esc(e.message || '') + '</div>';
      document.getElementById('src').textContent = 'No data';
    }
  }
  (async () => {
    const cities = await pronao.invoke('weather.cities');
    for (const c of cities) {
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = c.name;
      b.onclick = () => show(c); chips.append(b);
    }
    show(cities[0]);
  })();
</script>
